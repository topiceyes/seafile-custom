# Seafile 12 CE 二开生产部署（自建镜像；TLS 两种模式见 docs/007 §9）
# 完整流程（首次部署/彩排/回滚/升级）见 docs/007-production-deployment.md。
# 变量从 .env 读取（模板 .env.prod.example；dev 环境用 seafile-server.yml，两者独立）。
#
# 与 dev compose 的关键差异：
#   - 镜像用自建 tag（二开代码 + 前端 + collectstatic + 运维脚本 全烘进去），
#     不挂源码、也不挂任何宿主机文件 —— 所以本文件放哪个目录都能起
#   - SEAFILE_SERVER_LETSENCRYPT 是唯一的 https 开关（容器不读别的变量判断协议）
#   - 管理员初始化变量是 INIT_SEAFILE_ADMIN_*（不是 SEAFILE_ADMIN_*，镜像不认后者）
#   - 数据卷里不要预置任何 nginx 配置（会压制官方模板渲染）

services:
  db:
    # ⚠️ 走 ghcr 镜像，不是 docker.io/library/mariadb。原因：国内网络下
    # registry-1.docker.io 直接超时（2026-09-21 实测），而 ghcr.io 匿名可拉。
    # 三个镜像同源之后，服务器侧只剩一个要连通的目标，也不需要 docker login。
    # 这两个 ghcr 包由 .github/workflows/mirror-infra-images.yml 镜像而来，
    # 上游基础镜像更新时重跑那个 workflow 刷新。digest 记在 docs/010 §9。
    image: ghcr.io/topiceyes/mariadb:10.11
    container_name: seafile-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${SEAFILE_MYSQL_ROOT_PASSWORD}
      - MYSQL_LOG_CONSOLE=true
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - ${SEAFILE_MYSQL_VOLUME}:/var/lib/mysql
    healthcheck:
      # 没有这个，`docker compose up -d` 会让 seafile 与 db 同时起，
      # 首启时 seafile 的 setup 可能撞上 MariaDB 还没初始化完，于是必须
      # 「先手动起 db、等一会儿、再起 seafile」——那段人工步骤是被这一点逼出来的。
      #
      # 两项必须一起用：--connect 只证明能连上，--innodb_initialized 才证明
      # 首启的两阶段初始化（先仅 unix socket 跑初始化，再带网络重启）已经走完。
      # 只看端口是否开放会把「临时服务器」误判成就绪。
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30        # 5×30=150s 上限，够覆盖慢盘上的首启初始化
      start_period: 30s  # 这段时间内的失败不计入 retries
    networks:
      - seafile-net

  memcached:
    image: ghcr.io/topiceyes/memcached:1.6.29   # 同 db：镜像自 ghcr，避开被阻断的 Docker Hub
    container_name: seafile-memcached
    restart: unless-stopped
    entrypoint: memcached -m 256
    networks:
      - seafile-net

  seafile:
    image: ${SEAFILE_PRO_IMAGE}
    container_name: seafile
    restart: unless-stopped
    ports:
      # 两种模式都需要 80：
      #   LETSENCRYPT=true  → LE webroot 验证 + http→https 跳转，必须公网可达
      #   LETSENCRYPT=false → 上游反向代理把明文 HTTP 转发到这里（本项目形态）
      - "80:80"
      # 仅 LETSENCRYPT=true 时容器内才有 443 server 块。反代模式下容器根本不监听 443，
      # 这条留着只为本机直连排查；确认不用就可以整行删掉。
      - "443:443"
    volumes:
      # 唯一的挂载：数据卷。备份脚本与 cron 已烘进镜像（见 image/Dockerfile 第 7 项），
      # 所以本文件不含任何宿主机相对路径 —— 放哪个目录都能起，服务器上只需
      # 「一个 compose 文件 + 一个 .env」。
      - ${SEAFILE_VOLUME}:/shared
    environment:
      - DB_HOST=${SEAFILE_MYSQL_DB_HOST}
      - DB_ROOT_PASSWD=${SEAFILE_MYSQL_ROOT_PASSWORD}
      # 首启 setup 用这两个值创建 seafile 库用户并写进 seahub_settings.py（不传则随机）
      - DB_USER=${SEAFILE_MYSQL_DB_USER}
      - DB_PASSWORD=${SEAFILE_MYSQL_DB_PASSWORD}
      - TIME_ZONE=Asia/Shanghai
      # 纯域名（不带协议/端口）：证书文件名 + nginx server_name + SERVICE_URL 三处引用。
      # 反代模式下填【公网域名】（用户浏览器里那个），不是容器地址。
      - SEAFILE_SERVER_HOSTNAME=${SEAFILE_DOMAIN}
      # TLS 终止位置开关（bootstrap.py:is_https() 只认这一个变量）。两种模式：
      #   true  = 容器自己签发 Let's Encrypt 证书、自己监听 443。需 80/443 公网可达
      #   false = 上游反向代理终止 TLS，容器只监听 80（见 docs/007 §9）
      - SEAFILE_SERVER_LETSENCRYPT=${SEAFILE_SERVER_LETSENCRYPT:-true}
      # 生成的链接（SERVICE_URL / FILE_SERVER_ROOT）用哪个协议。
      # ⚠️ 反代模式必须显式设 https：setup 与 bootstrap 的 get_proto() 各自独立读这个变量，
      #    不设就生成 http:// 链接 → 文件上传下载、分享链接、钉钉回调地址全错。
      - SEAFILE_SERVER_PROTOCOL=${SEAFILE_SERVER_PROTOCOL:-https}
      # 首次启动建管理员（注意：镜像读的是 INIT_ 前缀，SEAFILE_ADMIN_* 无效）
      - INIT_SEAFILE_ADMIN_EMAIL=${SEAFILE_ADMIN_EMAIL}
      - INIT_SEAFILE_ADMIN_PASSWORD=${SEAFILE_ADMIN_PASSWORD}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      # 可选：钉钉凭据。容器内的 custom_bootstrap.py 读它们，只有非空才写进
      # seahub_settings.py。一般【留空】——钉钉配置已 constance 化，装完在
      # 「系统管理 → 设置」页填更合适（见 docs/002）。写这里的意义只是让首启
      # 就有个非空默认值。注意 SEAHUB_ 前缀，别写成 DINGTALK_。
      - SEAHUB_DINGTALK_APP_KEY=${SEAHUB_DINGTALK_APP_KEY:-}
      - SEAHUB_DINGTALK_APP_SECRET=${SEAHUB_DINGTALK_APP_SECRET:-}
    depends_on:
      # service_healthy：等 db 的 healthcheck 通过（= 首启初始化真的走完了）再起 seafile
      db:
        condition: service_healthy
      # memcached 起来即可用，没有需要等待的初始化
      memcached:
        condition: service_started
    networks:
      - seafile-net

networks:
  seafile-net:
