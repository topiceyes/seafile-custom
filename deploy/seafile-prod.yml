# Seafile 12 CE 二开生产部署（自建镜像；TLS 两种模式见 docs/007 §9）
# 完整流程（首次部署/彩排/回滚/升级）见 docs/007-production-deployment.md。
# 变量从 .env 读取（模板 env.prod.example；dev 环境用 seafile-server.yml，两者独立）。
#
# 与 dev compose 的关键差异：
#   - 镜像用自建 tag（二开代码 + 前端 + collectstatic + 运维脚本 全烘进去），
#     不挂源码、也不挂任何宿主机文件 —— 所以本文件放哪个目录都能起
#   - 13.0 起容器内 Let's Encrypt 已移除（SEAFILE_SERVER_LETSENCRYPT 不存在），
#     TLS 只能在容器外终止（反代）；SEAFILE_SERVER_PROTOCOL 决定生成链接的协议
#   - 管理员初始化变量是 INIT_SEAFILE_ADMIN_*（不是 SEAFILE_ADMIN_*，镜像不认后者）
#   - 数据卷里不要预置任何 nginx 配置（13.0 起 conf 构建期静态烘入镜像，不读数据卷）

services:
  db:
    # ⚠️ 走 ghcr 镜像，不是 docker.io/library/mariadb。原因：国内网络下
    # registry-1.docker.io 直接超时（2026-09-21 实测），而 ghcr.io 匿名可拉。
    # 三个镜像同源之后，服务器侧只剩一个要连通的目标，也不需要 docker login。
    # 这两个 ghcr 包由 .github/workflows/mirror-infra-images.yml 镜像而来，
    # 上游基础镜像更新时重跑那个 workflow 刷新。当前 digest 记在 docs/010 §8.1。
    image: ghcr.io/topiceyes/mariadb:10.11
    container_name: seafile-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${SEAFILE_MYSQL_ROOT_PASSWORD}
      - MYSQL_LOG_CONSOLE=true
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - ${SEAFILE_MYSQL_VOLUME}:/var/lib/mysql
    healthcheck:
      # 没有这个，`docker compose up -d` 会让 seafile 与 db 同时起，
      # 首启时 seafile 的 setup 可能撞上 MariaDB 还没初始化完，于是必须
      # 「先手动起 db、等一会儿、再起 seafile」——那段人工步骤是被这一点逼出来的。
      #
      # 两项必须一起用：--connect 只证明能连上，--innodb_initialized 才证明
      # 首启的两阶段初始化（先仅 unix socket 跑初始化，再带网络重启）已经走完。
      # 只看端口是否开放会把「临时服务器」误判成就绪。
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30        # 5×30=150s 上限，够覆盖慢盘上的首启初始化
      start_period: 30s  # 这段时间内的失败不计入 retries
    networks:
      - seafile-net

  redis:
    image: ghcr.io/topiceyes/redis:7-alpine   # 同 db：镜像自 ghcr，避开被阻断的 Docker Hub
    container_name: seafile-redis
    restart: unless-stopped
    # 13.0 起 seahub 默认缓存后端是 redis（CACHE_PROVIDER=redis）；AI/元数据功能硬要求。
    # 不设密码：容器不暴露端口，只在 seafile-net 内网可达。
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - seafile-net

  seafile:
    # ── 镜像跟随【通道 tag】latest ──────────────────────────────────────────
    # 它不是某个固定版本，而是一个指针：永远指向 CI 最近一次「构建 + 冒烟全绿」的
    # 产物。指针只在前移，且前移时 CI 会断言它的 digest 与那个不可变 tag 完全相同。
    #
    # 升级 = docker compose pull && docker compose up -d。服务器上【不需要改任何
    # 文件、不需要重取仓库】：CI 在「构建 + 冒烟都通过」之后才把 latest 搬过来。
    # 详见 docs/007 §6 与 docs/010 §4。
    #
    # ⚠️ 通道名只能是 latest，不要"优化"成 stable 之类更好听的名字。理由可复核、
    #    不是审美：`docker compose pull` 在服务**显式设了** pull_policy:
    #    missing / if_not_present 时，会跳过本地已存在的非 latest tag
    #    （docker/compose pkg/compose/pull.go：shouldPullImage → isLatestTag）。
    #    今天没设 pull_policy，所以两个名字都能用；但哪天有人为了"别老打 registry"
    #    加上它，latest 免疫、stable 会**静默停更**——正是本项目 2026-09-21 栽过的
    #    那个失败类别（pull 报成功、跑的还是旧镜像）。
    #
    # 回滚（一条命令，不改文件、不取仓库；可用 tag 见 GitHub Releases 记录）：
    #   SEAFILE_PRO_IMAGE=ghcr.io/topiceyes/seafile-mc:1.0.0.<hash> \
    #     docker compose pull && docker compose up -d
    # 把它写进 .env 也行，但那会让这台机器**从此不再跟随通道**，属于刻意 pin。
    #
    # 离线导入（docs/007 §2）：包里同时带了 latest，所以同样不用动 .env。
    image: ${SEAFILE_PRO_IMAGE:-ghcr.io/topiceyes/seafile-mc:latest}
    container_name: seafile
    restart: unless-stopped
    ports:
      # 只需要 80：13.0 起容器内不再签 LE 证书，TLS 一律在容器外终止，
      # 上游反向代理把明文 HTTP 转发到这里（本项目形态）
      #
      # 宿主机已有一个 nginx/面板（如宝塔）要占 80/443 时，在 .env 设
      #   SEAFILE_HTTP_LISTEN='127.0.0.1:8080'
      # 把容器挪开并只绑本机回环（所有外部流量必经宿主反代，没有绕过的后门端口）。
      # 默认 80 → 渲染成 "80:80"，独占服务器的部署行为不变。
      # ⚠️ 这是完整监听段（[绑定地址:]端口），不是单纯端口号——写 '8080' 也行（全网卡）。
      - "${SEAFILE_HTTP_LISTEN:-80}:80"
      # ⚠️ 这里【故意没有】443。容器根本不监听 443（静态 conf 只有 `listen 80`），
      #    映射它纯属冗余；而这台机器上往往还跑着别的东西，一旦对方占了 443，
      #    `docker compose up -d` 会在**新装那一刻**直接失败——属于「装完才发现」。
    volumes:
      # 唯一的挂载：数据卷。备份脚本与 cron 已烘进镜像（见 image/Dockerfile 第 7 项），
      # 所以本文件不含任何宿主机相对路径 —— 放哪个目录都能起，服务器上只需
      # 「一个 compose 文件 + 一个 .env」。
      - ${SEAFILE_VOLUME}:/shared
    environment:
      # 13.0 起 DB 环境变量改名（旧 DB_HOST/DB_USER/... 不再被读取，
      # wait_for_mysql 只认下面这组；不改名升级即死循环）
      - SEAFILE_MYSQL_DB_HOST=${SEAFILE_MYSQL_DB_HOST}
      - INIT_SEAFILE_MYSQL_ROOT_PASSWORD=${SEAFILE_MYSQL_ROOT_PASSWORD}
      # 首启 setup 用这两个值创建 seafile 库用户（不传则随机）
      - SEAFILE_MYSQL_DB_USER=${SEAFILE_MYSQL_DB_USER}
      - SEAFILE_MYSQL_DB_PASSWORD=${SEAFILE_MYSQL_DB_PASSWORD}
      # 13.0 起缓存后端默认 redis（memcached 需显式 CACHE_PROVIDER=memcached 续命；
      # AI/元数据功能硬要求 Redis，故本项目选 redis）
      - CACHE_PROVIDER=redis
      - REDIS_HOST=redis
      - TIME_ZONE=Asia/Shanghai
      # 纯域名（不带协议/端口）：nginx server_name + SERVICE_URL 引用。
      # 反代模式下填【公网域名】（用户浏览器里那个），不是容器地址。
      - SEAFILE_SERVER_HOSTNAME=${SEAFILE_DOMAIN}
      # 生成的链接（SERVICE_URL / FILE_SERVER_ROOT）用哪个协议。
      # ⚠️ 反代模式必须显式设 https：13.0 起 SERVICE_URL 由 PROTOCOL+HOSTNAME
      #    运行期即时计算，不设就生成 http:// 链接 → 文件上传下载、分享链接、
      #    钉钉回调地址全错。
      - SEAFILE_SERVER_PROTOCOL=${SEAFILE_SERVER_PROTOCOL:-https}
      # 首次启动建管理员（注意：镜像读的是 INIT_ 前缀，SEAFILE_ADMIN_* 无效）
      - INIT_SEAFILE_ADMIN_EMAIL=${SEAFILE_ADMIN_EMAIL}
      - INIT_SEAFILE_ADMIN_PASSWORD=${SEAFILE_ADMIN_PASSWORD}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      # 可选：钉钉凭据。容器内的 custom_bootstrap.py 读它们，只有非空才写进
      # seahub_settings.py。一般【留空】——钉钉配置已 constance 化，装完在
      # 「系统管理 → 设置」页填更合适（见 docs/002）。写这里的意义只是让首启
      # 就有个非空默认值。注意 SEAHUB_ 前缀，别写成 DINGTALK_。
      - SEAHUB_DINGTALK_APP_KEY=${SEAHUB_DINGTALK_APP_KEY:-}
      - SEAHUB_DINGTALK_APP_SECRET=${SEAHUB_DINGTALK_APP_SECRET:-}
    depends_on:
      # service_healthy：等 db 的 healthcheck 通过（= 首启初始化真的走完了）再起 seafile
      db:
        condition: service_healthy
      # redis 起来即可用，没有需要等待的初始化
      redis:
        condition: service_started
    networks:
      - seafile-net

networks:
  seafile-net:
