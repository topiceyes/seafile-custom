# -*- mode: nginx -*-
# [dev] 手工维护的 HTTPS 版配置（自签证书）。
#
# 送达方式（13.0 起）：由 seafile-server.yml 直接 bind-mount 到
#   /etc/nginx/sites-enabled/seafile.nginx.conf
# 覆盖官方镜像烘入的静态 conf（官方那份只 listen 80——13.0 移除了容器内 TLS，
# 而 dev 需要 443 自签 HTTPS 来测客户端 SSO，见 docs/006）。
# 12.0 时代它是渲染进数据卷压制模板渲染的，那条路在 13.0 已死（数据卷 conf 无人读）。
# 改本文件后：docker exec seafile nginx -s reload
#
# 证书：/shared/ssl/127.0.0.1.crt|key（宿主机 deploy/seafile-data/ssl/）
#
# X-Forwarded-Proto 直接用 $scheme 是【对的】：dev 容器自己终止 TLS，
# $scheme 如实体现协议（443 入口恒 https）。生产反代形态才需要
# $seafile_fwd_proto 分流（见 image/nginx/seafile.nginx.conf，两者别混）。

server {
    listen 80;
    server_name _ default_server;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 127.0.0.1;

    ssl_certificate      /shared/ssl/127.0.0.1.crt;
    ssl_certificate_key  /shared/ssl/127.0.0.1.key;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers ECDH+AESGCM:DH+AESGCM:ECDH+AES256:DH+AES256:ECDH+AES128:DH+AES:ECDH+3DES:DH+3DES:RSA+AESGCM:RSA+AES:RSA+3DES:!aNULL:!MD5:!DSS;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000/;
        proxy_read_timeout 310s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;

        add_header Access-Control-Allow-Origin *;
        client_max_body_size 0;
        access_log      /shared/seafile/logs/seahub.access.log seafileformat;
        error_log       /shared/seafile/logs/seahub.error.log;
    }

    location /seafhttp {
        rewrite ^/seafhttp(.*)$ $1 break;
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 0;
        proxy_read_timeout  36000s;

        proxy_buffering off;
        proxy_request_buffering off;

        access_log      /shared/seafile/logs/seafhttp.access.log seafileformat;
        error_log       /shared/seafile/logs/seafhttp.error.log;
    }

    location /seafdav {
        rewrite ^/seafdav$ /seafdav/ permanent;
    }

    location /seafdav/ {
        proxy_pass         http://127.0.0.1:8080/seafdav/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host $server_name;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout  1200s;
        client_max_body_size 0;

        access_log      /shared/seafile/logs/seafdav.access.log seafileformat;
        error_log       /shared/seafile/logs/seafdav.error.log;
    }

    location /:dir_browser {
        # Logo of WebDAV
        proxy_pass         http://127.0.0.1:8080/:dir_browser;
    }

    location /media {
        root /opt/seafile/seafile-server-latest/seahub;
    }
}
