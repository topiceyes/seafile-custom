# -*- mode: nginx -*-
# 定制静态 conf（13.0 起上游废除 /templates/ 模板渲染，conf 构建期静态烘入）。
# 基于上游 image/seafile_13.0/services/seafile.nginx.conf，补两处二开改动：
#   1. server_name —— 上游无 server_name（$http_host = $server_name 恒不成立），
#      而反代协议分流要靠它判「正式入口域名」。构建期 ARG 注入占位域名，
#      首启时 custom_bootstrap 用 SEAFILE_DOMAIN 重写（见下）。
#   2. X-Forwarded-Proto 两处（location / 与 /seafdav/）——上游依然没修，
#      反代模式（TLS 在云代理终止）下 $scheme 恒为 http，Django 需要这个头
#      才能算出正确的 good_origin，否则登录 403（docs/007 §9，2026-09-21 起
#      的 403 系列事故）。判定逻辑按访问入口分流（与 12.0 模板一致）。
#
# ⚠️ 本文件是【构建期】烘进 /etc/nginx/sites-enabled/ 的，不是模板。
#    域名占位符 __SEAFILE_SERVER_NAME__ 由 custom_bootstrap 在首启时替换为
#    真实的 SEAFILE_DOMAIN（conf 随镜像走，但域名是部署期才知道的）。
server {
    listen 80;
    listen [::]:80 ipv6only=on;

    server_name __SEAFILE_SERVER_NAME__;

    client_max_body_size 10m;

    # ---- 反向代理模式协议判定（TLS 在上游终止，本容器 nginx 只听 80）----
    # 按访问入口分流（2026-09-22 定稿，12.0 模板同款逻辑）：
    #   1) Host 是配置的域名（$server_name）→ 正式入口（云代理后面）→ 恒为 https。
    #      不看上游 X-Forwarded-Proto：代理可能把它自己到后端这段的协议写进头
    #      （http / 多级逗号串），而 Django 要求头值与 SECURE_PROXY_SSL_HEADER
    #      配置逐字相等，任何偏差都是 403。
    #   2) 其它 Host（IP 直连、内部名字）→ 有转发头按转发头，没有按 $scheme
    #      （明文 http）。Django 如实按 http 处理，http Origin 对得上 → 直连能登录。
    set $seafile_fwd_proto $http_x_forwarded_proto;
    if ($seafile_fwd_proto = "") {
        set $seafile_fwd_proto $scheme;
    }
    if ($http_host = $server_name) {
        set $seafile_fwd_proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8000/;
        proxy_read_timeout 310s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        # 让后端识别原始协议（上游 conf 缺失）；取值见 server 块顶部的 $seafile_fwd_proto
        proxy_set_header X-Forwarded-Proto $seafile_fwd_proto;
        proxy_set_header Connection "";
        proxy_http_version 1.1;

        add_header Access-Control-Allow-Origin *;
        client_max_body_size 0;
        access_log      /shared/seafile/logs/seahub.access.log seafileformat;
        error_log       /shared/seafile/logs/seahub.error.log;
    }

    location /seafhttp {
        rewrite ^/seafhttp(.*)$ $1 break;
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 0;
        proxy_read_timeout  36000s;

        proxy_buffering off;
        proxy_request_buffering off;

        access_log      /shared/seafile/logs/seafhttp.access.log seafileformat;
        error_log       /shared/seafile/logs/seafhttp.error.log;
    }

    location /seafdav {
        rewrite ^/seafdav$ /seafdav/ permanent;
    }

    location /seafdav/ {
        proxy_pass         http://127.0.0.1:8080/seafdav/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host $server_name;
        # 让后端识别原始协议（上游 conf 缺失）
        proxy_set_header   X-Forwarded-Proto $seafile_fwd_proto;
        proxy_read_timeout  1200s;
        client_max_body_size 0;

        access_log      /shared/seafile/logs/seafdav.access.log seafileformat;
        error_log       /shared/seafile/logs/seafdav.error.log;
    }

    location /:dir_browser {
        # Logo of WebDAV
        proxy_pass         http://127.0.0.1:8080/:dir_browser;
    }

    location /media {
        root /opt/seafile/seafile-server-latest/seahub;
    }

}
