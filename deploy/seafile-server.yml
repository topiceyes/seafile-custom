# Seafile 12 CE 二开开发环境（自签 HTTPS，见 docs/006）
# 官方模板参考：https://manual.seafile.com/docker/11.0/
#
# 密钥不写在本文件：从 deploy/.env 读取（.env 不入库，模板见 .env.example）。
# 首次部署：cp .env.example .env && 填值 && ./init-conf.sh && ./gen-ssl-cert.sh
services:
  db:
    # 与 seafile-prod.yml 一致走 ghcr 镜像。开发机上 Docker Hub 只是靠
    # Docker Desktop 的代理（proxy.orb.internal:8305）才通，生产机没有这层代理——
    # 两边用同一个源，就少一类「dev 好好的、生产拉不动」的差异。
    image: ghcr.io/topiceyes/mariadb:10.11
    container_name: seafile-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${SEAFILE_MYSQL_ROOT_PASSWORD}
      - MYSQL_LOG_CONSOLE=true
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - ${SEAFILE_MYSQL_VOLUME}:/var/lib/mysql
    # 与 seafile-prod.yml 一致：让 `docker compose up -d` 一条命令按序起全部服务。
    # dev 卷已初始化，本不会撞上首启竞态；加着是为了两边行为一致，
    # 免得「重建一个干净 dev 卷」时又冒出「必须先起 db」的错觉。
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - seafile-net

  redis:
    image: ghcr.io/topiceyes/redis:7-alpine   # 同 db：镜像自 ghcr
    container_name: seafile-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - seafile-net

  seafile:
    image: seafileltd/seafile-mc:13.0.28
    container_name: seafile
    restart: unless-stopped
    ports:
      # HTTPS 主入口（自签证书；客户端 SSO 必须走 https）
      - "443:443"
      # 80 → nginx 会自动 301 到 https://127.0.0.1
      - "80:80"
      - "8180:80"
    volumes:
      - ${SEAFILE_VOLUME}:/shared
      # seahub 二开源码（只挂 Python 包目录；勿挂整个 seahub/，容器内 thirdpart 含已装依赖和 gunicorn）
      # 注意：版本目录硬编码，升级 Seafile 镜像版本后需同步修改
      - ../seahub/seahub:/opt/seafile/seafile-server-13.0.28/seahub/seahub
      # dev 自签 HTTPS 的 nginx conf。13.0 起 conf 构建期静态烘入镜像、数据卷里的
      # conf 不再有任何读者（12.0 是预渲染进数据卷压制模板渲染），所以 dev 改成
      # 直接 bind-mount 覆盖容器内那份。改了它要 docker exec seafile nginx -s reload。
      - ./conf-templates/nginx/seafile.nginx.conf:/etc/nginx/sites-enabled/seafile.nginx.conf:ro
      # 离职员工同步定时任务（容器自带 cron 服务加载 /etc/cron.d/）。
      # dev 用的是官方镜像（没烘 cron），所以这里仍然挂载；文件在 image/ 下，
      # 与生产镜像烘进去的是同一份，不会漂移。prod 不需要挂载（见 seafile-prod.yml）。
      - ./image/dingtalk-sync.cron:/etc/cron.d/dingtalk-sync:ro
    environment:
      # 13.0 起 DB 环境变量改名（旧 DB_HOST/DB_ROOT_PASSWD 不再被读取）
      - SEAFILE_MYSQL_DB_HOST=${SEAFILE_MYSQL_DB_HOST}
      - INIT_SEAFILE_MYSQL_ROOT_PASSWORD=${SEAFILE_MYSQL_ROOT_PASSWORD}
      # 升级脚本（upgrade_12.0_13.0.sh → db_update_helper.py）只从环境变量读
      # DB 用户名/密码，没有 seafile.conf 兜底——缺了就是 "using password: NO" 死
      - SEAFILE_MYSQL_DB_USER=${SEAFILE_MYSQL_DB_USER}
      - SEAFILE_MYSQL_DB_PASSWORD=${SEAFILE_MYSQL_DB_PASSWORD}
      # 13.0 起缓存后端默认 redis
      - CACHE_PROVIDER=redis
      - REDIS_HOST=redis
      - TIME_ZONE=Asia/Shanghai
      # HTTPS 站点（证书 /shared/ssl/127.0.0.1.crt|key，即 deploy/seafile-data/ssl/）
      # 注意：这里不能带端口，否则 SERVICE_URL/回调地址会带端口
      - SEAFILE_SERVER_HOSTNAME=127.0.0.1
      - SEAFILE_SERVER_PROTOCOL=https
      # 初始化时自动创建管理员（仅首次启动生效）
      - SEAFILE_ADMIN_EMAIL=${SEAFILE_ADMIN_EMAIL}
      - SEAFILE_ADMIN_PASSWORD=${SEAFILE_ADMIN_PASSWORD}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - seafile-net

networks:
  seafile-net:
