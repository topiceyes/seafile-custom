# 把生产依赖的两个基础设施镜像（MariaDB / Redis）镜像到 ghcr.io。
# （13.0 起缓存后端从 memcached 换成 redis：13.0 的 seahub 默认 CACHE_PROVIDER=redis，
#   且 AI/元数据功能硬要求 Redis。memcached 的镜像条目已随升级移除。）
#
# ## 为什么需要这个
#
# 生产 compose 有三个镜像，早先来自【两个】仓库：
#   seafile   → ghcr.io/topiceyes/seafile-mc   （本项目 CI 构建）
#   mariadb   → docker.io/library/mariadb      （Docker Hub）
#   redis     → docker.io/library/redis        （Docker Hub）
#
# 2026-09-21 实测（国内网络、不带代理）：ghcr.io 匿名拉取完整可用，
# registry-1.docker.io 直接超时。所以生产服务器上 `docker compose pull` 必然
# 卡在 MariaDB/Redis 上——而且**报错会指向 Docker Hub，不是我们自己的镜像**，
# 很容易误判成「ghcr 挂了」。
#
# 镜像过来之后三个镜像同源，服务器侧只剩一个要连通的目标。
#
# ## ⚠️ 必须产出 manifest list（索引），不能是单平台 manifest
#
# 这不是风格问题，是踩出来的：
#
#   用 `docker pull --platform linux/amd64` + `docker tag` + `docker push` 镜像，
#   推上去的是**单平台 manifest**（mediaType `.../manifest.v2+json`）。在 arm64
#   开发机上 `docker save --platform linux/amd64` 打离线包时，会报
#   `no suitable export target found: ... does not provide the specified platform`；
#   而**不带 --platform 更糟**——它产出一个 8KB 的空包且不报错，一路静默到服务器
#   才发现。对照组：seafile-mc 镜像（OCI manifest）带 --platform 正常，572MB。
#
#   索引用 --platform 选平台是标准路径，与 Docker Hub 自己的 tag 行为一致，所有
#   工具（含 docker save）都正常。所以这里用 `docker buildx imagetools create`
#   做 registry→registry 复制，它产出索引。
#
#   下面的断言就是为这条假设设的：**假设写死在代码里而不验证，就是下一次静默漂移**。
#
# 代价：imagetools 复制的是**整个多架构索引**（含 arm64），比只留 amd64 大约多占
# 一倍存储。换来的是不用解析平台 digest、行为与 Docker Hub 原 tag 完全一致。
# GitHub 官方口径是容器镜像的存储与带宽免费，这点开销可以接受。
#
# ## 为什么不从开发机直接推
#
# 开发机存的 ghcr 凭据只有读权限（`docker push` 报
# permission_denied: The token provided does not match expected scopes），
# 而 CI 的 GITHUB_TOKEN 带 `packages: write`。所以这一步只能走 CI。
#
# ## 什么时候跑
#
# 手动（改完下面的镜像清单后跑一次即可）。push 触发只挂在【本文件自身】上——
# 改清单 = 想重跑；其它提交不该动它。
#   gh workflow run mirror-infra-images.yml
#
# 上游基础镜像更新（如 mariadb:10.11 被重推）时重跑一次刷新即可。
#
# 排障见 docs/010 §8。
name: mirror-infra-images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-infra-images.yml'

concurrency:
  group: mirror-infra-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write          # 推 ghcr.io 需要

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false     # 一个失败不掩盖另一个的结果
      matrix:
        # 这里就是唯一的事实来源：两个 compose 文件都从 ghcr 引这些 tag，
        # 改这里 = 改服务器实际用的版本。
        image:
          - docker.io/library/mariadb:10.11
          - docker.io/library/redis:7-alpine

    steps:
      # 共享 runner IP 上匿名拉 Docker Hub 容易撞限流（toomanyrequests）。
      # 有凭据就用，没有就跳过——不因此让镜像失败（secrets 在 step 级 if 里不可用，
      # 只能先放进 env 再判断，与 build-image.yml 同一套路）。
      - name: 登 Docker Hub（配置了凭据才跑，规避匿名拉取限流）
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # imagetools 需要 buildx driver；镜像地址若来自 docker.io 则要能解析多架构索引
      - uses: docker/setup-buildx-action@v3

      - name: 镜像 ${{ matrix.image }}
        env:
          SRC: ${{ matrix.image }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # docker.io/library/mariadb:10.11 → mariadb / 10.11
          NAME=${SRC##*/}
          REPO=${NAME%%:*}
          TAG=${NAME##*:}
          DST="ghcr.io/${OWNER}/${REPO}:${TAG}"

          echo "==> $SRC  →  $DST"
          # registry→registry 复制，不落本地。产出 manifest list（见文件头注）。
          docker buildx imagetools create -t "$DST" "$SRC"

          # ---- 断言：必须是索引，且含 amd64 ----
          MEDIA=$(docker buildx imagetools inspect "$DST" --format '{{.Manifest.MediaType}}')
          echo "MediaType: $MEDIA"
          case "$MEDIA" in
            *manifest.list*|*image.index*)
              echo "✅ 是 manifest list" ;;
            *)
              echo "::error::$DST 的 mediaType 是 $MEDIA，不是 manifest list。"
              echo "::error::单平台 manifest 会让 arm64 上 docker save --platform linux/amd64 失败，"
              echo "::error::不带 --platform 时更会产出 8KB 空包且不报错。见本文件头注。"
              exit 1 ;;
          esac

          # ⚠️ 必须先把输出收进变量再 grep，不能写成 `inspect | grep -q`：
          # grep -q 命中即退出 → 关闭管道 → inspect 收到 SIGPIPE 而非零退出 →
          # 在 `set -o pipefail` 下整条管道报失败，**即使匹配成功**。
          # 这个坑的迷惑性在于失败信息是「索引里没有 linux/amd64」，
          # 而索引里明明有（第一次跑就是这么误报的）。
          INSPECT=$(docker buildx imagetools inspect "$DST")
          if ! grep -q 'linux/amd64' <<<"$INSPECT"; then
            echo "::error::$DST 的索引里没有 linux/amd64"
            echo "$INSPECT" | head -20
            exit 1
          fi
          echo "✅ 索引含 linux/amd64"

          DST_DIGEST=$(docker buildx imagetools inspect "$DST" --format '{{.Manifest.Digest}}')
          SRC_DIGEST=$(docker buildx imagetools inspect "$SRC" --format '{{.Manifest.Digest}}')

          {
            echo "dst_digest=$DST_DIGEST"
            echo "dst=$DST"
          } >> "$GITHUB_OUTPUT"

          # 供汇总步骤收集
          echo "| \`$DST\` | \`$DST_DIGEST\` | \`$SRC_DIGEST\` |" >> /tmp/mirror-rows.md

          echo "✅ $DST"
          echo "   目标 digest: $DST_DIGEST"
          echo "   源   digest: $SRC_DIGEST"

      # 尽力而为：新包默认可能是 private，而匿名拉不到就等于这次镜像白做。
      # 这个 PATCH 对【用户所有】的包不保证被 GITHUB_TOKEN 接受，所以
      # continue-on-error——成不成都由汇总步骤给出人工兜底路径。
      - name: 尝试把包设为 public（尽力而为）
        continue-on-error: true
        env:
          SRC: ${{ matrix.image }}
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO=$(basename "${SRC%%:*}")
          echo "尝试 PATCH /user/packages/container/$REPO → public"
          curl -sS -X PATCH \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/$REPO" \
            -d '{"visibility":"public"}' | head -c 400
          echo

      - name: 汇总
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## 基础设施镜像已镜像到 ghcr.io"
            echo ""
            echo "| 目标 | 目标 digest | 上游 digest |"
            echo "|---|---|---|"
            [ -f /tmp/mirror-rows.md ] && cat /tmp/mirror-rows.md
            echo ""
            echo "服务器侧至此三个镜像全部来自 ghcr.io，无需 Docker Hub、无需 docker login。"
            echo ""
            echo "### ⚠️ 首次镜像后要确认包是 public"
            echo ""
            echo "仓库 public **不等于** 镜像包 public，两者是分开的。新包默认可能是私有，"
            echo "匿名拉取会 404。逐个确认（应显示 Public）："
            echo ""
            echo "- https://github.com/users/${{ github.repository_owner }}/packages/container/mariadb/settings"
            echo "- https://github.com/users/${{ github.repository_owner }}/packages/container/redis/settings"
            echo ""
            echo "验证（不带任何凭据能拉到才算真的 public）："
            echo '```'
            echo "docker pull --platform linux/amd64 ghcr.io/${{ github.repository_owner }}/mariadb:10.11"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
