# 构建二开生产镜像并推送到 ghcr.io。
#
# 设计要点：**workflow 里不写构建逻辑**。CI 只负责准备源码树，然后调用
# deploy/build-image.sh（与开发机同一个脚本）。这样「CI 产物 ≡ 本地产物」
# 是结构上成立的，而不是靠两边各自维护一套命令保持同步。
#
# 源码从哪来：不 fork。CI 在 GitHub 网络内按固定 SHA 浅取上游 haiwen/seahub，
# 再应用 patches/*.patch —— 见 patches/MANIFEST.md 与 docs/010。
# （fork 路线曾被策略关闭：上游是公开仓库，其 fork 无法设为私有。2026-09-20 本仓库
# 转 public 后该禁令已失效，但仍保留补丁路线——因为只有这条路线会验证「补丁能逐字节
# 复现二开分支」，fork 路线下没有任何东西做这个验证。详见 docs/010 §2。）
#
# ⚠️ 重写历史后强推**不会**可靠触发本 workflow（paths 过滤在 before 非 after 祖先时
# 判定不可靠，2026-09-20 实测）。这类推送后手动跑：gh workflow run build-image.yml
#
# 平台：只构建 linux/amd64。生产目标是 amd64，runner 也是 amd64，构建/CRA/冒烟
# 全 native。加 arm64 会让整个前端 stage 走 QEMU（769MB npm ci + 吃内存的 CRA
# 构建），把十几分钟变成一小时以上。arm64 只服务开发机彩排，而开发机本身就是
# arm64，用 ./build-image.sh --local 本地产出即可。
#
# 发布流程与排障见 docs/010-ci-release-pipeline.md。
name: build-image

on:
  # 主发布入口：手动触发（gh workflow run build-image -f force=true）
  workflow_dispatch:
    inputs:
      force:
        description: '覆盖已存在的 tag（tag 是内容寻址的，同 tag 即同内容；覆盖的正当理由只有「重建以刷新基础镜像」）'
        type: boolean
        default: false

  # 自动触发：会影响镜像内容、或会影响【发布出去的那三个资产】的路径变更才跑。
  # 漏了 paths 过滤的话，一次文档提交也会烧掉十几分钟额度 + 产出一个无意义 tag。
  #
  # ⚠️ 最后三条（前三个是 tag 哈希的输入，后三个不是）必须分开看：
  #   前三个改了 → tag 变 → 走正常构建，十几分钟。
  #   后三个改了 → tag **不变**（它们不在哈希里）→ 守卫判「资产内容旧」→ mode=publish
  #                → 只重传三个文件，**40 秒，不重建**。
  # 所以把后三个加进来不会让文档改动烧构建额度；不加的话它们压根不会触发 workflow，
  # 于是固定的安装 URL 上那份**永远是旧的**（2026-09-21 发现的洞，见守卫里那段注释）。
  push:
    branches: [main]
    paths:
      - 'patches/**'                 # ↓ 三条是 tag 哈希输入，改了要真构建
      - 'deploy/image/**'
      - 'deploy/build-image.sh'
      - 'deploy/seafile-prod.yml'    # ↑ 这三条是 Release 资产（= 新服务器的安装入口）
      - 'deploy/init-prod-env.sh'    #   不在 tag 哈希里 → 只会触发「重传」，不会重建
      - 'deploy/env.prod.example'
      - 'deploy/smoke-test.sh'       #   冒烟脚本是发布门禁本体：改了它必须能重验既有
                                     #   tag（tag 不变 → publish 模式只重跑冒烟）。
                                     #   2026-09-24 实撞：冒烟红后只修脚本，paths 不含
                                     #   它 → 不触发 → 红着的 tag 永远没人复验
      - '.github/workflows/build-image.yml'

# 同一 ref 上不并发构建；且**不取消**进行中的构建——两次构建抢同一个 tag 是最糟的失败模式
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write          # 建 Release（发布记录 = 唯一台账，见 docs/010 §9）
  packages: write          # 推 ghcr.io 需要

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/seafile-mc
  # 通道 tag：所有生产部署跟随它（compose 里 image: …:latest）。
  # 名字只能是 latest —— 见 deploy/seafile-prod.yml 里那段注释与 docs/010 §4。
  CHANNEL: latest
  # 挂在 Release 上的三个文件（= 新服务器的安装入口，固定 URL 指向它们）。
  # 只此一份清单：守卫判「发布是否完整」与发布步骤用它，两处不会漂。
  # 至少要有这三个 —— 少一个，「发布完整」就是假的，重跑也补不回来。
  #
  # ⚠️ 资产名不能以点开头。GitHub 会把点开头的资产名改写成 default.xxx
  # （2026-09-21 实测：.env.prod.example 挂上去变成 default.env.prod.example），
  # 固定 URL …/releases/latest/download/.env.prod.example 于是永远 404。
  # 所以模板在仓库里就叫 deploy/env.prod.example，不带点。
  RELEASE_ASSETS: >-
    deploy/seafile-prod.yml deploy/init-prod-env.sh deploy/env.prod.example

jobs:
  build:
    runs-on: ubuntu-latest
    # secrets 上下文在 step 级 if 中不可用，只能先把 secret 放进 env 再判断
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      # fetch-depth: 0 —— 记录发布时要跟上一个 release tag 做 diff（构建输入变更列表）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读取基线（patches/MANIFEST.md）
        id: base
        run: |
          set -euo pipefail
          BASE=$(awk '$1=="base_commit"{print $3; exit}' patches/MANIFEST.md)
          TREE=$(awk '$1=="tree_sha"{print $3; exit}' patches/MANIFEST.md)
          [ -n "$BASE" ] && [ -n "$TREE" ] || { echo "::error::patches/MANIFEST.md 缺少 base_commit 或 tree_sha"; exit 1; }
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "tree=$TREE" >> "$GITHUB_OUTPUT"
          echo "基线 commit: $BASE"
          echo "目标 tree  : $TREE"

      # 按 SHA 浅取上游。GitHub 声明 allow-reachable-sha1-in-want，故可直接取任意
      # 可达 commit，不受「分支名会前进」影响。仓库是浅克隆，--depth 1 足够。
      # 必须落在 $GITHUB_WORKSPACE/seahub：build-image.sh 从 REPO_ROOT 推导这个路径。
      - name: 取上游 seahub（按固定 SHA）
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          git init -q seahub
          git -C seahub remote add origin https://github.com/haiwen/seahub.git
          git -C seahub fetch -q --depth 1 origin "$BASE"
          git -C seahub checkout -q FETCH_HEAD
          FETCHED=$(git -C seahub rev-parse HEAD)
          [ "$FETCHED" = "$BASE" ] || { echo "::error::取到的 commit ($FETCHED) 与基线 ($BASE) 不符"; exit 1; }
          echo "✅ 基线就位：$FETCHED"

      - name: 应用补丁系列
        run: |
          set -euo pipefail
          git -C seahub -c user.name=ci -c user.email=ci@github.invalid \
            am "$GITHUB_WORKSPACE"/patches/*.patch
          echo "已应用 $(git -C seahub rev-list --count "${{ steps.base.outputs.base }}..HEAD") 个提交"

      # 核心不变量：补丁必须逐字节复现二开分支的树。这条断言让「上游漂移」或
      # 「补丁被改坏」变成构建失败，而不是悄悄发出一个内容不对的镜像。
      - name: 校验源码树 == MANIFEST 记录的 tree_sha
        env:
          EXPECTED: ${{ steps.base.outputs.tree }}
        run: |
          set -euo pipefail
          ACTUAL=$(git -C seahub rev-parse 'HEAD^{tree}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::源码树不符：实际 $ACTUAL，期望 $EXPECTED。检查 patches/ 与 MANIFEST.md 是否同步。"
            exit 1
          fi
          echo "✅ 树校验通过：$ACTUAL"

      # build-image.sh --check-tree 是同一套逻辑的第二道（走 git apply --cached 而非 git am），
      # 顺带验证「补丁本身可独立应用」——CI 里两次校验成本可忽略。
      - name: 补丁树自检
        run: ./deploy/build-image.sh --check-tree

      # ---- tag 血缘断言：把「半途而废的版本升级」拦在发布之前 ----
      - name: tag 一致性断言
        id: tag
        run: |
          set -euo pipefail
          TAG=$(./deploy/build-image.sh --print-tag)
          PATCHES=$(ls patches/*.patch | wc -l | tr -d ' ')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # ① tag 形如 12.0.14-dingtalk.<补丁数>.<构建输入哈希>（哈希在 build-image.sh 里算）
          echo "$TAG" | grep -qE "^12\.0\.14-dingtalk\.${PATCHES}\.[0-9a-f]{8}$" \
            || { echo "::error::tag ($TAG) 与补丁数 ($PATCHES) 不符";
                 echo "::error::期望形如 12.0.14-dingtalk.$PATCHES.<8位十六进制>"; exit 1; }

          # ② tag 的版本前缀 == Dockerfile 里 BASE_IMAGE 的版本。
          #    升级 Seafile 时要同步改 BASE_IMAGE/INSTALLPATH/版本前缀/tag，
          #    这条能在「只改了一半」时提前拦住，避免发出 12.0.14 与 12.1.x 混搭的镜像。
          DLVER=$(grep -oE 'seafile-mc:[0-9]+\.[0-9]+\.[0-9]+' deploy/image/Dockerfile | head -1 | cut -d: -f2)
          [ "$DLVER" = "${TAG%%-dingtalk*}" ] \
            || { echo "::error::Dockerfile 基础镜像版本 ($DLVER) 与 tag 前缀 (${TAG%%-dingtalk*}) 不符"; exit 1; }

          # ③ 补丁文件名连续无缺口
          EXPECT=$(seq -f '%04g' 1 "$PATCHES" | tr '\n' ' ')
          ACTUAL=$(ls patches/*.patch | sed 's|patches/||;s|-.*||' | tr '\n' ' ')
          [ "$EXPECT" = "$ACTUAL" ] \
            || { echo "::error::补丁编号不连续：期望 [$EXPECT]，实际 [$ACTUAL]"; exit 1; }

          echo "✅ tag 血缘校验通过：$TAG（补丁 $PATCHES 个，基础镜像 $DLVER）"
          echo "   哈希段是【构建输入的内容哈希】（补丁内容 + deploy/image/** + build-image.sh），"
          echo "   所以同 tag ⇒ 同内容；改任何构建输入都会自动得到新 tag，不需要 force。"

      - uses: docker/setup-buildx-action@v3     # type=gha 缓存导出需要 docker-container driver

      # 登录必须在「检查 tag 是否已存在」之前：镜像是私有的，未认证的 inspect
      # 会因鉴权失败而被误判成「tag 不存在」，守卫就形同虚设。
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 守卫的结论走**一个三态输出** `mode`，不是两个布尔。
      #
      #   （空）      force=true 时守卫整步不跑；等价于 build
      #   build       tag 未占用 → 正常构建 → 冒烟 → 搬运 → 发布
      #   publish     tag 在、发布不完整 → 只补做搬运与发布，**不重建**
      #   none        tag 在、发布完整 → 什么都不做（绿）
      #
      # ⚠️ 这里曾经是两个布尔（`skip` / `skip_build`），2026-09-21 因此出了一次
      # **静默事故**：守卫判「发布完整」时只写了 `skip=true`，而构建步骤只看
      # `skip_build`（当时是空串，不等于 'true'）——于是**构建照跑**，把同一个
      # 不可变 tag 用新构建的字节覆盖了。整个过程全绿，通道没动，没有任何告警；
      # 结果就是 tag 指向的字节与 Release 记录的 digest 对不上。
      # 两个布尔天然可以互相矛盾，三态不会。改这里时别退回两个输出。
      - name: 检查 tag 是否已存在
        id: guard
        if: ${{ github.event.inputs.force != 'true' }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$TAG" >/dev/null 2>&1; then

            # ---- tag 已存在。但「镜像发了」不等于「发布做完了」 ----
            #
            # 发布 = 推镜像 → 搬通道 tag → 建 Release。这三件事分属三个步骤，中间任何
            # 一步失败，重跑都会撞上「tag 已存在」。若这里一律 skip 掉全部后续步骤，
            # 重跑就**静默什么都不做**——正是本项目反复在追的那类失败。
            # 所以先判「发布是否已完整」。三个条件**全部**成立才算完整：
            #   ① 通道 tag 存在且指向本 tag 的同一个 digest
            #   ② Release 存在
            #   ③ Release 上的资产一个不少，**且内容与仓库当前的一字不差**
            # ③ 是实际踩出来的（2026-09-21 首跑）：只判 Release 存在的话，资产缺失
            # 的残缺发布会让重跑判定为「完整」而静默什么都不做——正是这个守卫要防的事。
            #
            # ⚠️ ③ 后来从「名字在不在」升级成了「**逐字节一致**」（2026-09-21 补）。
            # 原来只查名字，漏掉的是这么一个洞：三个资产不在 tag 哈希的输入里
            # （哈希只含 patches/ + deploy/image/ + build-image.sh），所以**单独改它们
            # 不会产生新 tag**；只改资产 → tag 不变、名字也都在 → 守卫判「完整」→
            # mode=none → **固定安装 URL 上那份永远是旧的**。新服务器会装到
            # 「旧 compose + 新镜像」的组合，全程全绿、零告警。
            # 用 release asset API 的 digest 字段（就是 sha256）比，缺字段时按不一致
            # 处理——宁可多补发一次（幂等、40 秒、不重建），不可静默漏发。
            CH=$(docker buildx imagetools inspect "$IMAGE:$CHANNEL" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            TG=$(docker buildx imagetools inspect "$IMAGE:$TAG"     --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            ASSETS_OK=true
            ASSETS_WHY=""
            if gh release view "$TAG" >/dev/null 2>&1; then
              HAVE=$(gh release view "$TAG" --json assets \
                       --jq '.assets[] | "\(.name) \(.digest // "")"' 2>/dev/null || true)
              for f in $RELEASE_ASSETS; do
                n=$(basename "$f")
                # 先认名字在不在（各占一行，名字里不会有空格）
                line=$(echo "$HAVE" | awk -v n="$n" '$1==n {print; exit}')
                if [ -z "$line" ]; then
                  ASSETS_OK=false; ASSETS_WHY="$ASSETS_WHY $n(缺);"
                  continue
                fi
                got=$(echo "$line" | cut -d' ' -f2)
                want="sha256:$(sha256sum "$f" | cut -d' ' -f1)"
                if [ "$got" != "$want" ]; then
                  ASSETS_OK=false; ASSETS_WHY="$ASSETS_WHY $n(内容旧/无digest);"
                fi
              done
            else
              ASSETS_OK=false; ASSETS_WHY=" Release(不存在);"
            fi
            if [ -n "$CH" ] && [ "$CH" = "$TG" ] && [ "$ASSETS_OK" = "true" ]; then

              # 自动触发（push）撞上「tag 已存在」= 构建输入一字未改，本来就没什么要建的
              # ——这是**正常结果，不是失败**。
              #
              # 之所以要在这儿分开处理：`paths` 过滤在「强推、before 不是 after 的祖先」时
              # 判定不可靠（docs/010 §3，2026-09-20 实测两次表现相反），会让这种空转跑起来。
              # 旧写法一律 `exit 1`，于是**每次空转都给仓库管理员发一封「构建失败」邮件**，
              # 而实际什么都没坏——2026-09-20 那次就是这么误报的。守卫拦得对，报错报得不对。
              if [ "${{ github.event_name }}" = "push" ]; then
                {
                  echo "## 跳过构建：镜像已是最新"
                  echo ""
                  echo "\`$IMAGE:$TAG\` 已存在，通道 \`$CHANNEL\` 已指向它，Release 的三个资产在且与仓库一字不差。"
                  echo "tag 含构建输入哈希，同 tag 即同内容，说明这次推送没有改动任何构建输入"
                  echo "（\`patches/\`、\`deploy/image/\`、\`build-image.sh\`）。无需重建，本次运行视为成功。"
                } >> "$GITHUB_STEP_SUMMARY"
                echo "::notice::$IMAGE:$TAG 已存在且发布完整，自动触发无需构建，跳过（非失败）。"
                echo "mode=none" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              # 手动触发则相反：是人明确要求构建的，什么都不做必须让人看见 → 保持失败。
              echo "::error::$IMAGE:$TAG 已存在。tag 是内容寻址的（含构建输入哈希），所以同 tag 就"
              echo "::error::意味着同内容——这次构建不会产出任何新东西。多半是你的改动没触及任何"
              echo "::error::构建输入（例如只改了文档）。确认后无需重建。"
              echo "::error::确实要覆盖（例如重建以拉取上游更新过的基础镜像）：-f force=true"
              exit 1
            fi

            # 走到这儿：镜像在，但通道 / Release / 资产没跟上（多半是上次发布半途失败）。
            # 只补做发布，不重建 —— 内容寻址的 tag 保证了补做的是同一份字节。
            echo "::notice::$IMAGE:$TAG 已存在，但发布不完整（通道 digest=$CH 本 tag digest=$TG；资产问题：${ASSETS_WHY:-无}）——跳过构建，只补做发布。"
            echo "mode=publish" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "✅ tag 未被占用：$TAG"
          echo "mode=build" >> "$GITHUB_OUTPUT"

      # Docker Hub 匿名拉取在共享 runner IP 上容易撞限流（toomanyrequests）。
      # 有凭据就用，没有就跳过——不因此让构建失败。
      - name: 登 Docker Hub（配置了凭据才跑，规避匿名拉取限流）
        if: env.DOCKERHUB_USERNAME != '' && steps.guard.outputs.mode != 'publish' && steps.guard.outputs.mode != 'none'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送
        if: steps.guard.outputs.mode != 'publish' && steps.guard.outputs.mode != 'none'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # CACHE_ARGS 用 mode=max：npm ci 那层在【被丢弃的 frontend stage】里，
          # mode=min 缓存不到——而那正是最贵的一步。
          # 关掉 provenance/sbom：单平台镜像被包成 attestation index 后会在 ghcr UI
          # 里显示成 unknown/unknown 平台并占额外存储，对单机消费的私有镜像没有收益。
          PLATFORMS=linux/amd64 \
          CACHE_ARGS="--cache-from type=gha,scope=seafile-mc --cache-to type=gha,mode=max,scope=seafile-mc" \
          EXTRA_ARGS="--provenance=false --sbom=false" \
          ./deploy/build-image.sh ghcr.io/${{ github.repository_owner }}
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # 验证【真正推上去的那份字节】，而不是本地构建结果（runner 是 amd64，native 执行）。
      # 断言本身在 deploy/smoke-test.sh —— 与开发机人工验证共用同一份，避免两处漂移
      # （这套断言曾因 workflow 与 docs 各存一份而写错了路径，见该脚本头部注释）。
      #
      # ⚠️ publish 模式【也要跑冒烟】（2026-09-23 补）：构建先推 tag、冒烟后跑——
      #    冒烟失败时 tag 已在 registry 里但从未被验证。若 publish 跳过冒烟，下一次
      #    撞上这个 tag 的运行会判 mode=publish 直接搬通道，坏镜像就上了通道。
      #    「tag 已存在」只证明【推过】，不证明【验证过】；唯一例外是 none（什么都不做）。
      - name: 冒烟验证已推送的镜像
        if: steps.guard.outputs.mode != 'none'
        env:
          # publish 模式不走构建步骤，拿不到它写的 GITHUB_ENV；这里直接从 tag 步骤取
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE:$TAG"
          docker run --rm --entrypoint sh \
            -v "$PWD/deploy/smoke-test.sh:/smoke.sh:ro" \
            "$IMAGE:$TAG" /smoke.sh 2>&1 | tee /tmp/smoke.log

      # ---- 搬通道 tag：必须【在冒烟之后】 ----
      #
      # 顺序是有意的，不是随便放的。若把通道做成 `buildx build` 的第二个 -t，
      # 通道会在**推送那一刻**就指过去，而冒烟只能跑在推送之后——冒烟一挂，
      # 通道已经指向坏镜像。所以必须在这里单独搬，并且搬完立刻自证。
      #
      # `--prefer-index=false` 不能省：imagetools create 对**单平台 manifest** 默认会
      # 包一层新 index（本机 dry-run 实测：源 image.manifest.v1+json → 产物
      # image.index.v1+json），那样 :latest 的 digest 与不可变 tag 的 digest 就不再
      # 相同，「同一份字节」这个口径断掉，回滚与离线包都会对不上号。
      - name: 移动通道 tag
        if: steps.guard.outputs.mode != 'none'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --prefer-index=false -t "$IMAGE:$CHANNEL" "$IMAGE:$TAG"

          D_CH=$(docker buildx imagetools inspect "$IMAGE:$CHANNEL" --format '{{.Manifest.Digest}}')
          D_TG=$(docker buildx imagetools inspect "$IMAGE:$TAG"     --format '{{.Manifest.Digest}}')
          MT=$(docker buildx imagetools inspect "$IMAGE:$CHANNEL"   --format '{{.Manifest.MediaType}}')

          [ "$D_CH" = "$D_TG" ] || {
            echo "::error::通道 tag 的 digest ($D_CH) ≠ 不可变 tag 的 digest ($D_TG)"
            echo "::error::imagetools create 大概没走原样拷贝分支——检查 --prefer-index=false 还在不在"
            exit 1
          }
          case "$MT" in
            *image.manifest*) ;;
            *) echo "::error::$IMAGE:$CHANNEL 不是单平台 manifest（$MT）——digest 口径与不可变 tag 不一致"; exit 1 ;;
          esac

          echo "DIGEST=$D_CH" >> "$GITHUB_ENV"
          echo "✅ $IMAGE:$CHANNEL → $D_CH（与 $TAG 同一份字节）"

      # ---- 发布记录 = 唯一的发布台账（docs/010 §9；旧的手工台账已冻结为历史） ----
      #
      # 替代原来「CI 打印 digest，人去改文件 + 手工补台账」的做法：那个动作在 N 个
      # 部署的规模下是乘 N 的手工活，而且漏做是静默的（2026-09-21 的事故）。
      #
      # 用 view→edit/create 分支做成幂等：force 重建、以及上面那条「只补做发布」
      # 的重跑路径都会走到这里。
      - name: 发布记录（GitHub Release）
        if: steps.guard.outputs.mode != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # PATCHES 在上游那一步是 shell 局部变量，传不过来；这里重算一次
          PATCHES=$(ls patches/*.patch | wc -l | tr -d ' ')

          # 上一个【别的】版本的 tag。必须排掉本 tag 自己：补做发布时 Release 已经
          # 存在，直接取 list 的第一条会拿到自己，于是 diff 成空、正文写着
          # 「构建输入变更（自 <本 tag>）」——2026-09-21 那条记录就是这么来的。
          PREV=$(gh release list --limit 20 --exclude-drafts --json tagName --jq '.[].tagName' 2>/dev/null \
                   | grep -vx "$TAG" | head -1 || true)

          if [ -z "$PREV" ]; then
            CHANGES="（首次发布，无对比基线）"
          elif git rev-parse -q --verify "refs/tags/$PREV" >/dev/null 2>&1; then
            CHANGES=$(git log --no-decorate --oneline "$PREV..$GITHUB_SHA" -- \
                        patches deploy/image deploy/build-image.sh)
            [ -n "$CHANGES" ] || CHANGES="（构建输入无变化——内容寻址的 tag 本不该重现，这多半是同 tag 的补做发布）"
          else
            CHANGES="（上一个版本 $PREV 的 git tag 不在本地——浅克隆？改 fetch-depth）"
          fi

          # 部署文件（compose）改动是**唯一**还需要已装服务器重取文件的场景 —— 必须让人看见。
          # 服务器不再取任何文件是设计使然，代价就是 compose 改动不会自己传播。
          #
          # ⚠️ 这一条对「同 tag 的补做发布」也成立且必要：补做时 Release 上挂着的资产
          # 可能来自更早的提交（首跑就是 d7772c3 的文件，而本跑是 4456893 的）。
          # 拿它跟自己比，能如实反映「服务器手上那份是不是最新的」。
          NEED_REFETCH=""
          if [ -n "$PREV" ] && gh release download "$PREV" -p seafile-prod.yml -O /tmp/prev-compose.yml 2>/dev/null; then
            cmp -s /tmp/prev-compose.yml deploy/seafile-prod.yml || NEED_REFETCH=yes
          elif [ -n "$PREV" ]; then
            # 老 Release 没有这个资产（或下载失败）：无从对比，宁可提示也不静默放过
            NEED_REFETCH=unknown
          fi

          {
            echo "# $TAG"
            echo ""
            # 补做发布 = 这个 tag 的字节是**此前某次运行**构建的，本次只搬通道 + 更新记录。
            # 若上一版本记录里的 digest 与本条不同，那是同一个 tag 被重建覆盖过 ——
            # 这种事必须留在正文里，不能只活在 run 日志里（2026-09-21 就这么出过一次）。
            if [ "${{ steps.guard.outputs.mode }}" = "publish" ]; then
              echo "> ℹ️ **本次只做了发布，没有重新构建。** 冒烟仍在本轮对该 tag 重跑并通过（publish 不再跳过冒烟）。"
              echo "> 若你记得上一版记录里的 digest 与本条**不同**，那是这个不可变 tag 被重建覆盖过——"
              echo "> 排查见 [docs/010 §7](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/010-ci-release-pipeline.md)。"
              echo ""
            fi
            if [ "$NEED_REFETCH" = "yes" ]; then
              echo "> ⚠️ **本版改了部署文件（\`seafile-prod.yml\`）——已装好的服务器需要重取一次**:"
              echo ">"
              echo "> \`\`\`"
              echo "> cd /opt/seafile-custom/deploy"
              echo "> curl -fL -o seafile-prod.yml https://github.com/$GITHUB_REPOSITORY/releases/latest/download/seafile-prod.yml"
              echo "> docker compose config | grep image:     # 先只解析，确认文件是完整的"
              echo "> docker compose pull && docker compose up -d"
              echo "> \`\`\`"
              echo ">"
              echo "> 这是服务器侧**唯一**还需要取文件的场景。平时升级什么都不用取。"
              echo ""
            elif [ "$NEED_REFETCH" = "unknown" ]; then
              echo "> ℹ️ **无法自动比对部署文件**（上一个 Release \`$PREV\` 上没有 \`seafile-prod.yml\` 资产）。"
              echo "> 若你的服务器是在通道 tag 模型之前装的，升级前请按 [docs/007 §6](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/007-production-deployment.md) 重取一次部署文件。"
              echo ""
            fi
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 镜像（不可变） | \`$IMAGE:$TAG\` |"
            echo "| 通道 tag | \`$IMAGE:$CHANNEL\` → 同一个 digest |"
            echo "| digest | \`$DIGEST\` |"
            echo "| 补丁数 | $PATCHES |"
            echo "| 源码树 | \`${{ steps.base.outputs.tree }}\` |"
            echo "| 基线 | \`${{ steps.base.outputs.base }}\` |"
            echo "| 提交 | \`$GITHUB_SHA\` |"
            echo "| 运行 | [$GITHUB_RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) |"
            echo ""
            echo "## 升级（服务器上，不取任何文件）"
            echo '```'
            echo "docker compose pull && docker compose up -d"
            echo '```'
            echo "## 回滚（一条命令，不改文件、不取仓库）"
            echo '```'
            echo "SEAFILE_PRO_IMAGE=$IMAGE:$TAG docker compose pull && \\"
            echo "  SEAFILE_PRO_IMAGE=$IMAGE:$TAG docker compose up -d"
            echo '```'
            echo "## 离线包"
            echo '```'
            echo "cd deploy && ./make-offline-bundle.sh $TAG   # 包里同时带 $TAG 与 $CHANNEL"
            echo '```'
            echo "## 构建输入变更（自 ${PREV:-无可比基线}）"
            echo '```'
            echo "$CHANGES"
            echo '```'
            echo "<details><summary>冒烟验证与三层指纹</summary>"
            echo ""
            echo '```'
            sed -n '/--- 指纹 ---/,$p' /tmp/smoke.log 2>/dev/null || echo "（本次未构建，无冒烟日志）"
            echo '```'
            echo "</details>"
          } > /tmp/release-notes.md

          # 资产清单来自 workflow 级 env，守卫用的是同一份，两处不会漂。
          ASSETS="$RELEASE_ASSETS"
          echo "资产：$ASSETS"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/release-notes.md --latest
            # edit 不碰资产。上一轮若在传资产时挂掉，Release 会永远缺文件——
            # 而固定安装 URL 就指着这些文件。--clobber 让它幂等。
            # shellcheck disable=SC2086
            gh release upload "$TAG" --clobber $ASSETS
          else
            # create 是「先建 draft → 传资产 → 再 publish」，所以 latest 解析到的
            # Release 一定资产齐全（不会下到一个半成品）。
            # shellcheck disable=SC2086
            gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" \
              --notes-file /tmp/release-notes.md --latest $ASSETS
          fi

          # 清掉不在清单里的旧资产。改过名字的（例如 2026-09-21 那个被 GitHub 改写成
          # default.env.prod.example 的）会一直挂在 Release 上，成为永远下不到的垃圾，
          # 也让「Release 上的资产 == 清单」这条不变量失效。先传后删，不会出现空窗。
          # 两边都用 basename 比：清单里是仓库路径，Release 上是文件名。
          KNOWN=$(for f in $ASSETS; do basename "$f"; done)
          while read -r n; do
            [ -n "$n" ] || continue
            echo "$KNOWN" | grep -qx "$n" || {
              echo "删除陈旧资产：$n"
              gh release delete-asset "$TAG" "$n" --yes
            }
          done < <(gh release view "$TAG" --json assets --jq '.assets[].name')

          # 发布是否完整的判据 = 这个 tag 的 Release 三个资产都在。不完整就红，
          # 让重跑走 mode=publish 补做路径，而不是留下一个「看着发布了」的残缺记录。
          HAVE=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for f in $ASSETS; do
            echo "$HAVE" | grep -qx "$(basename "$f")" \
              || { echo "::error::Release $TAG 缺资产 $(basename "$f")"; exit 1; }
          done
          echo "已发布：https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      - name: 记录 digest
        if: steps.guard.outputs.mode != 'none'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "## 已发布"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 不可变 tag | \`$IMAGE:$TAG\` |"
            echo "| 通道 tag | \`$IMAGE:$CHANNEL\` |"
            echo "| digest（两者同一份字节） | \`$DIGEST\` |"
            echo "| 基线 | \`${{ steps.base.outputs.base }}\` |"
            echo "| 源码树 | \`${{ steps.base.outputs.tree }}\` |"
            echo "| 发布记录 | https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG |"
            echo ""
            echo "**发布到此结束，没有人工步骤。** 服务器侧升级："
            echo '```'
            echo "docker compose pull && docker compose up -d"
            echo '```'
            echo "不需要重取任何文件、不需要改任何文件。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "已发布：$DIGEST"
